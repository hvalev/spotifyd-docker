# paths-ignore are not respected on PRs. For now this will run along with the nightly
# https://github.com/actions/runner/issues/2324
name: ci
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'spotifyd-hash.txt'
    branches:
      - '**'

jobs:
  buildx:
    runs-on: self-hosted
    timeout-minutes: 4320
    env:
      # only main pushes may overwrite the shared cache: branch, PR and
      # dependabot runs read it anonymously but never rewrite it (a PR
      # that edits this file could otherwise poison the cache)
      CACHE_TO: >-
        ${{ github.ref == 'refs/heads/main'
        && github.actor != 'dependabot[bot]'
        && 'type=registry,ref=hvalev/spotifyd-buildcache:latest,mode=max'
        || '' }}
    steps:
      - name: Free Disk Space
        uses: ShubhamTatvamasi/free-disk-space-action@master
      
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get Version
        id: get_version
        uses: dhkatz/get-version-action@v3.0.0

      - name: Read Spotifyd Version
        id: read_version
        run: |
          VERSION=$(cat spotifyd-version.txt)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Spotifyd Version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        # gated exactly like CACHE_TO: writing the shared cache is a push, and
        # dependabot-authored runs never receive Actions secrets, so an ungated
        # login there dies with "Username and password required". Reads stay
        # anonymous - the cache repository is public.
        if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
        with:
          username: ${{ secrets.DOCKERHUBUNAME }}
          password: ${{ secrets.DOCKERHUBTOKEN }}

      - name: Build alsa
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64,linux/386,linux/amd64
          target: alsa-release
          cache-from: type=registry,ref=hvalev/spotifyd-buildcache:latest
          cache-to: ${{ env.CACHE_TO }}
          build-args: |
            VERSION=${{ env.VERSION }}

      - name: Build alsa-dbus
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64,linux/386,linux/amd64
          target: alsa-dbus-release
          cache-from: type=registry,ref=hvalev/spotifyd-buildcache:latest
          cache-to: ${{ env.CACHE_TO }}
          build-args: |
            VERSION=${{ env.VERSION }}

      - name: Build pulseaudio
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64,linux/386,linux/amd64
          target: pulseaudio-release
          cache-from: type=registry,ref=hvalev/spotifyd-buildcache:latest
          cache-to: ${{ env.CACHE_TO }}
          build-args: |
            VERSION=${{ env.VERSION }}

      - name: Build pulseaudio-dbus
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64,linux/386,linux/amd64
          target: pulseaudio-dbus-release
          cache-from: type=registry,ref=hvalev/spotifyd-buildcache:latest
          cache-to: ${{ env.CACHE_TO }}
          build-args: |
            VERSION=${{ env.VERSION }}
